version: "3.8"

services:
  # 1. FastAPI REST API Sunucusu
  forensic-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forensic_vision_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
      - reports_data:/app/reports_generated
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. Streamlit Web Paneli (Dashboard)
  forensic-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forensic_vision_dashboard
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
      - reports_data:/app/reports_generated
    depends_on:
      - forensic-api
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

volumes:
  uploads_data:
  outputs_data:
  reports_data:
